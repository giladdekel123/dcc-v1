<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DCC V1</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="site">
    <div class="wrap">
      <h1><span class="brand">DCC</span> Find a project document from what you remember</h1>
      <form id="search-form" role="search">
        <label for="q" class="visually-hidden">What do you remember about the document?</label>
        <input id="q" name="q" type="search" maxlength="500" autocomplete="off"
               placeholder="Describe what you remember: subject, who sent it, what changed, roughly when">
        <button type="submit">Search</button>
      </form>
      <details id="refine">
        <summary>Refine <span id="refine-count"></span></summary>
        <div class="filters">
          <label>Document type <select data-filter="doc_type"></select></label>
          <label>Discipline <select data-filter="discipline"></select></label>
          <label>Stage <select data-filter="stage"></select></label>
          <label>Organisation <select data-filter="org"></select></label>
          <label>WBS <select data-filter="wbs"></select></label>
          <label>Issued from <input type="date" data-filter="date_from"></label>
          <label>to <input type="date" data-filter="date_to"></label>
          <button type="button" id="clear-filters" class="secondary">Clear all</button>
        </div>
      </details>
      <div id="chips" aria-label="Active filters"></div>
      <p id="notice" class="notice" hidden></p>
      <p class="note">Candidates are ranked by how well they match, with the evidence for each. You decide which one is right.</p>
    </div>
  </header>

  <main class="wrap">
    <h2 id="summary" tabindex="-1" aria-live="polite"></h2>
    <ol id="results" class="results"></ol>
  </main>

  <footer class="wrap">
    <span id="health">Checking the backend…</span>
    <span>Kestrel Valley Link Road is a fictional project; all documents are synthetic.</span>
  </footer>
</body>
</html>
