# Kestrel Valley Link Road (KVL): fictional project reference data.
# All organisations and people are fictional.

project:
  code: KVL
  name: Kestrel Valley Link Road
  description: >
    A 4.2 km single-carriageway bypass for the market town of Kestrel Valley, with the
    River Kest Bridge, the Mill Lane box culvert, two attenuation ponds and the Eastern
    Roundabout.

