  - date: 2025-06-03
    summary: CGC raises RFI-0011 about the west abutment bearing plinths (near-duplicate distractor).
    issue:
      - doc: RFI11
        rev: P01
        stage: CN
        status: OP
        description: Raised
        content:
          raised_by: Jo Kimani
          addressed_to: Priya Nair
          subject: West abutment bearing plinth dimensions
          question:
            - >
              Bearing plinth dimensions on the west abutment GA (KVL-ADM-410-DR-S-0101) show
              600 x 600 mm, but the bearing schedule gives 650 x 650 mm. Please confirm which
              governs before the plinths are formed.
          references: [KVL-ADM-410-DR-S-0101]
          response_required_by: 2025-06-10
          programme_impact: Minor - plinth formwork on hold

  - date: 2025-06-12
    summary: Progress meeting 7 records the soft clay found during east abutment piling.
    issue:
      - doc: MM07
        rev: P01
        stage: CN
        status: IS
        description: Issued
        content:
          meeting_no: 7
          location: Castlegate site office, Kestrel Valley
          chair: Mark Bellamy
          attendees: [Mark Bellamy, Jo Kimani, Ryan Doyle, Helen Marsh, Tom Reddy, Priya Nair]
          apologies: [David Okafor]
          items:
            - ref: "7.1"
              title: Health and safety
              discussion: No reportable incidents this period. Near miss at the haul road crossing to be briefed at toolbox talks.
              action: Brief all operatives on the haul road crossing
              owner: Jo Kimani
              due: 2025-06-19
            - ref: "7.2"
              title: Programme
              discussion: Earthworks two weeks behind due to wet weather. Recovery plan to follow.
              action: Issue recovery programme
              owner: Mark Bellamy
              due: 2025-06-26
            - ref: "7.3"
              title: River Kest Bridge - east abutment piling
              discussion: >
                Piling started on 9 June. At pile E3 the boring log recorded very soft grey clay
                from about -2 mAOD, and the design toe level of -5.15 mAOD was reached still in
                soft clay. Piling at the east abutment is paused. RD noted the ground does not
                match the GI interpretation.
              action: Raise an RFI on east abutment pile founding level
              owner: Jo Kimani
              due: 2025-06-16
            - ref: "7.4"
              title: Mill Lane culvert
              discussion: Trial holes found the water main about 0.6 m deeper than the utility records, close to the culvert roof.
              action: Write to Northvale Water with trial hole results
              owner: Tom Reddy
              due: 2025-06-20
            - ref: "7.5"
              title: Pond 2 East
              discussion: ADM revised drainage calculations for Pond 2 are awaited.
              action: Confirm date for revised Pond 2 calculations
              owner: Priya Nair
              due: 2025-06-20

  - date: 2025-06-16
    summary: CGC raises RFI-0012 on the east abutment piles.
    issue:
      - doc: RFI12
        rev: P01
        stage: CN
        status: OP
        description: Raised
        content:
          raised_by: Jo Kimani
          addressed_to: Priya Nair
          subject: East abutment piles - soft clay below founding level
          question:
            - >
              During boring of pile E3 at the east abutment, very soft grey clay was encountered
              from approximately -2.0 mAOD and continued below the design toe level of
              -5.15 mAOD shown on drawings KVL-ADM-410-DR-S-0102 C01 and KVL-ADM-410-DR-S-0110 C01.
            - >
              Please confirm a revised pile founding level and pile length for the east abutment
              piles, and whether temporary casing is required through the soft clay.
          references: [KVL-ADM-410-DR-S-0102, KVL-ADM-410-DR-S-0110, KVL-SGI-410-RP-T-0001]
          response_required_by: 2025-06-30
          programme_impact: Significant - east abutment piling stopped

  - date: 2025-06-20
    summary: RFI-0011 answered and closed.
    status_change:
      - {doc: RFI11, rev: P01, status: CL, by: CGC, note: Answered by ADM email - 650 x 650 mm governs}

  - date: 2025-06-30
    summary: ADM responds to RFI-0012 by letter (filed under a legacy filename).
    issue:
      - doc: LT31
        rev: P01
        stage: CN
        status: IS
        description: Issued
        filename: Response to RFI 12 - piles.docx
        content:
          to: Mark Bellamy
          cc: [Helen Marsh, Anne Kowalski]
          subject: River Kest Bridge - east abutment piles - response to RFI-0012
          paragraphs:
            - >
              Thank you for RFI-0012 of 16 June 2025. We have reviewed the pile E3 boring log
              against borehole BH-E3 in the ground investigation report, which recorded a soft
              clay lens between -2.1 mAOD and -6.4 mAOD with mudstone at -9.8 mAOD.
            - >
              The east abutment piles are to be lengthened from 18.0 m to 24.0 m, with the pile
              toe level lowered from -5.15 mAOD to -11.15 mAOD to found in the mudstone. The pile
              cut-off level is unchanged at +12.85 mAOD.
            - >
              Temporary casing is to extend at least 1.0 m below the base of the soft clay.
              Revised drawings KVL-ADM-410-DR-S-0102 and KVL-ADM-410-DR-S-0110 will be issued at
              revision C02, with a new pile schedule. Brightwell Checking Services will re-check
              the revised design.
          signed_by: Priya Nair

  - date: 2025-07-08
    summary: BCS reissues the check certificate to cover the lengthened piles.
    issue:
      - doc: CERT
        rev: P02
        stage: CN
        status: IS
        description: Reissued for revised east abutment piles
        content:
          structure: River Kest Bridge - abutments and foundations
          category: Category III
          checked_documents:
