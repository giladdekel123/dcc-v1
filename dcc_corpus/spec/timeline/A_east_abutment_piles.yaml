            - Piles lengthened following RFI-0012. See letter KVL-ADM-410-LT-S-0031.
      - doc: PL
        rev: C02
        stage: CN
        status: FC
        description: Piles lengthened following RFI-0012
        content:
          scale: "1:50 @ A1"
          drawn: LC
          checked: PN
          approved: DO
          geometry: {piles: 8, pile_diameter_mm: 900, cutoff_level: 12.85, toe_level: -11.15}
          notes:
            - Pile toe level -11.15 mAOD. Pile cut-off level +12.85 mAOD.
            - Temporary casing to extend min. 1.0 m below base of soft clay.
            - Pile cap soffit level +12.75 mAOD.
      - doc: PS
        rev: C02
        stage: CN
        status: FC
        description: First issue with lengthened piles
        content:
          geometry: {piles: 8, pile_diameter_mm: 900, cutoff_level: 12.85, toe_level: -11.15}

  - date: 2025-07-22
    summary: CGC asks for clarification of the cut-off level on piling layout C02.
    issue:
      - doc: RFI15
        rev: P01
        stage: CN
        status: OP
        description: Raised
        content:
          raised_by: Jo Kimani
          addressed_to: Priya Nair
          subject: East abutment pile cut-off level clarification
          question:
            - >
              Piling layout KVL-ADM-410-DR-S-0110 C02 gives a pile cut-off level of +12.85 mAOD
              and a pile cap soffit of +12.75 mAOD. Please confirm that the 100 mm projection of
              the piles into the pile cap is intended.
          references: [KVL-ADM-410-DR-S-0110]
          response_required_by: 2025-07-29
          programme_impact: None if answered before pile cap works

  - date: 2025-07-25
    summary: CGC submits the east abutment piling method statement for approval.
    issue:
      - doc: MS
        rev: P01
        stage: CN
        status: AP
        description: Submitted for approval
        content:
          submitted_by: Ryan Doyle
          for_review_by: Priya Nair
          spec_clause: Series 1600 - Piling and embedded retaining walls
          sections:
            - heading: 1 Scope
              paragraphs:
                - >
                  Construction of 8 No. 900 mm bored cast-in-place piles at the River Kest Bridge
                  east abutment to drawings KVL-ADM-410-DR-S-0110 C02 and KVL-ADM-410-SC-S-0003 C02.
            - heading: 2 Method
              paragraphs:
                - >
                  Piles will be bored by rotary rig with temporary casing advanced through the
                  alluvium and the soft clay lens. Casing will extend at least 1.0 m below the
                  base of the soft clay, as confirmed on each boring log by the piling supervisor.
                - >
                  Concrete will be placed by tremie. Reinforcement cages will be fixed and
                  inspected before placing.
            - heading: 3 Testing
              paragraphs:
                - >
                  Integrity testing on all piles. One static load test on a working pile
                  nominated by the designer.

  - date: 2025-07-29
    summary: RFI-0015 answered and closed.
    status_change:
      - {doc: RFI15, rev: P01, status: CL, by: CGC, note: Answered by ADM email - 100 mm projection intended}

  - date: 2025-08-05
    summary: RFI-0012 closed once the C02 drawings and certificate are in place (no new revision).
    status_change:
      - {doc: RFI12, rev: P01, status: CL, by: CGC, note: Closed - answered by KVL-ADM-410-LT-S-0031}

  - date: 2025-08-08
    summary: ADM approves the method statement with comments (status change, no new revision).
    status_change:
      - {doc: MS, rev: P01, status: AN, by: ADM, note: Casing depth to be recorded on every boring log}

  - date: 2025-08-14
    summary: Progress meeting 10 records RFI-0012 as closed and piling resumed.
    issue:
      - doc: MM10
        rev: P01
        stage: CN
        status: IS
        description: Issued
        content:
          meeting_no: 10
          location: Castlegate site office, Kestrel Valley
          chair: Mark Bellamy
          attendees: [Mark Bellamy, Jo Kimani, Helen Marsh, Tom Reddy, Priya Nair, David Okafor]
          apologies: [Ryan Doyle]
          items:
            - ref: "10.1"
              title: Health and safety
              discussion: No incidents this period.
            - ref: "10.2"
              title: Programme
              discussion: Recovery programme accepted. Earthworks now one week behind.
            - ref: "10.3"
              title: River Kest Bridge - east abutment piling
              discussion: >
                RFI-0012 is closed. Revised drawings C02 and the pile schedule were issued on
                10 July and the check certificate was reissued on 8 July. The piling method
                statement was approved with comments on 8 August. Piling at the east abutment
                resumed on 11 August with 24 m piles.
            - ref: "10.4"
              title: Mill Lane culvert
              discussion: >
                ADM response to RFI-0013 issued 15 July - culvert to be lowered and a protection slab
                provided over the water main. Revised culvert drawing and slab details due 20 August.
                Northvale Water acceptance of the slab proposal is still awaited.
              action: Chase Northvale Water for acceptance of the protection slab
              owner: Tom Reddy
              due: 2025-08-21

  - date: 2025-10-02
    summary: ADM issues GA P03 for comment after C02; its title block wrongly still says FC.
    issue:
      - doc: GA
        rev: P03
        stage: CN
        status: RV
        description: Proposed abutment drainage layer - for comment
        content:
          scale: "1:100 @ A1"
          drawn: LC
          checked: PN
          approved: DO
          titleblock_status: FC   # planted discrepancy: register says RV
          geometry: {piles: 8, pile_diameter_mm: 900, cutoff_level: 12.85, toe_level: -11.15}
          notes:
            - Proposed change - weep holes replaced by a geocomposite drainage layer.
            - Issued for comment only. Revision C02 remains the construction issue.
            - Piles unchanged from revision C02.

