  - {case: legacy_filename, target: CT07@P01, note: "Filename does not follow the convention"}
  - {case: near_duplicate, target: CT07, note: "Four monthly compaction test reports with the same structure"}
  - {case: near_duplicate, target: BOQ600, note: "A second bill of quantities, for earthworks rather than pavements"}
  - {case: status_change_no_revision, target: RFI16@P01, note: "Open, then closed"}
  - {case: status_change_no_revision, target: CAP@P01, note: "For approval, then accepted"}
  - {case: status_change_no_revision, target: VAR03@P01, note: "For approval, then accepted"}
  - {case: status_change_no_revision, target: PDR@P02, note: "For approval, then accepted"}
