# Storyline F: earthworks and mainline pavement (WBS 200).
#
# M2.5 expansion. Answer-safety: nothing here concerns the east abutment piles, the roundabout
# surfacing or Variation 07; the RFI is about a cutting, and the BoQ is for earthworks.

storyline: F
