# Storyline B: Mill Lane culvert clash with the existing water main.
#
# Levels (mAOD): road at the crossing +14.60. Culvert 3.0 m wide x 2.0 m high internally with a
# 0.30 m roof slab. C01 invert +10.80, roof top +13.10. Water main (300 mm ductile iron) recorded at
# invert +14.00 but found by trial holes at +13.40, i.e. 0.6 m deeper, leaving 0.30 m above the
# culvert roof against the 0.60 m Northvale Water requires. C02 lowers the invert by 450 mm to
# +10.35 (roof top +12.65, clearance 0.75 m) and adds a protection slab because the main's cover
# under the carriageway is only 0.9 m.

storyline: B
name: Mill Lane culvert and water main

