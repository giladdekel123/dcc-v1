  - {case: superseded_by_new_number, target: DSR, note: "Superseded by KVL-ADM-300-RP-D-0021"}
  - {case: titleblock_discrepancy, target: DL3@C02, note: "Title block drawing number 0302; register 0303"}
  - {case: legacy_filename, target: P1GA@C01, note: "Filename does not follow the convention"}
  - {case: near_duplicate, target: P1GA, note: "Pond 1 West vs Pond 2 East"}
  - {case: near_duplicate, target: DSAR, note: "Similar title to the Drainage Strategy Report it supersedes"}
  - {case: file_copy, target: DSAR@P01, note: "Also filed as an email attachment"}
  - {case: status_change_no_revision, target: FCD@P01, note: "For approval, then approved with comments"}
  - {case: status_change_no_revision, target: DSR@P02, note: "For approval, then accepted"}
