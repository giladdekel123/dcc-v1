  - {from: DSAR, to: DSR, type: supersedes}
  - {from: DSAR, to: NCC11, type: responds_to}
  - {from: P2GA@C02, to: DSAR, type: related_to}
  - {from: DL3@C02, to: P2GA@C02, type: related_to}
  - {from: FCD, to: DSAR, type: related_to}

planted:
