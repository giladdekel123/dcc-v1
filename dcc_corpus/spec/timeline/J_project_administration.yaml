# Storyline J: project administration (WBS 000 / 100) - early meetings, meeting 11, more monthly
# progress reports, management plans and general correspondence.
#
# M2.5 expansion. Answer-safety: no minutes discuss the east abutment piling problem or the
# recovery programme; no meeting in mid October; no other July progress report or report issued
# in early September; no lane closures, signals or tie-in.

