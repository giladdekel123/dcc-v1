# IR-1 frozen-58 interpreted requests (annotation pass, NOT frozen until reviewed).
# Inputs: ID + raw query text only, from eval/queries/generated.yaml and eval/queries/human.yaml.
#   Extraction read only the `- id:` and `query:` lines; no other field was parsed or displayed.
# Vocabulary: supabase/migrations/20260930020126_convention_vocab.sql (discipline, doc_type, stage).
#   WBS and organisation codes are not defined outside the corpus spec -> see unresolved_vocabulary.
# No corpus, database, search output, expected answers or reports were consulted. No retrieval or evaluation was run.
#
# Annotation conventions (annotator choices, for review):
#   text        = the useful lexical expression of the person's recollection, not the residue left after
#                 structured extraction. Words may appear BOTH in text and in a clue/relation/state field when
#                 they carry lexical subject/entity information. Kept when present in raw_text: specific
#                 asset/project/place names (e.g. River Kest Bridge, Pond 2 East, Mill Lane Culvert), named
#                 organisations (e.g. Northvale Water, Stratum), document/title terminology that expresses what
#                 is remembered (e.g. GA, general arrangement, layout, programme, bill of quantities, check
#                 certificate), and technical subject/content terms. Left out: generic actor/role words
#                 (contractor, designer, council) unless part of the content, broad WBS headings (Project
#                 Management, drainage), generic document-class words (letter, drawing, report, submittal,
#                 RFI, minutes, question, document), question/request scaffolding, relation wording, state
#                 instructions, hedges, and approximate dates/amounts. Relations, states and uncertainty stay
#                 in their structured fields.
#   doc_type    = likely at most (never confirmed). discipline = likely when the word qualifies the target
#                 document, context when it is topic/location or a WBS heading word. wbs = confirmed (stated).
#   relation    = only when the anchor is described as a document. Wording names the type (reply -> responds_to,
#                 replaced -> supersedes); purely temporal wording (followed / after) -> any.
#                 Direction reads `from --link_type--> to`; the later/replying/replacing document is `from`.
#   state_source = extension to the schema: literal raw_text words supporting a non-default state.
#   approx / verify / withdrawn items are literal substrings of raw_text.
#   source_file = annotation provenance only. unresolved_vocabulary = source-bound information that could not
#                 safely be mapped to the permitted vocabulary. Neither is an IR-1 retrieval signal.

